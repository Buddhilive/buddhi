[project]
name = "buddhi-ai"
version = "1.0.0"
readme = "README.md"
description = "My first application"

requires-python = ">=3.10"

dependencies = [
    "chromadb>=1.1.1",
    "llama-index-core>=0.14.4",
    "llama-index-readers-file>=0.5.4",
    "llama-index-vector-stores-chroma>=0.5.3",
    "pyloid>=0.26.3",
    "pyloid-adapter[fastapi]>=0.2.4",
    "python-multipart>=0.0.20",
    "transformers>=4.57.0",
    "torch>=2.8.0",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-llms-huggingface>=0.6.1",
]

[dependency-groups]
dev = ["pyloid-builder==0.2.2", "ruff>=0.13.2"]
